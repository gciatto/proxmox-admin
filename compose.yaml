services:
  admin:
    # Shipped in the image with admin.sh (see there); relative paths resolve against the
    # workspace: the cluster repository, or this checkout.
    image: ${PVE_ADMIN_IMAGE:-proxmox-admin:local}
    working_dir: /workspace
    stdin_open: true
    tty: true
    env_file:
      - path: cluster.env # shared settings of a cluster repository, committed
        required: false
      - path: .env # personal settings, untracked
        required: false
    environment:
      ADMIN_UID: "${ADMIN_UID:-1000}"
      ADMIN_GID: "${ADMIN_GID:-1000}"
      PROXMOX_TOKEN_SECRET_FILE: /run/secrets/proxmox-token
      # AI CLIs: credentials as alternatives to a login stored in the mounted config dirs.
      # Passed through only when set in the invoking shell.
      ANTHROPIC_API_KEY:
      CLAUDE_CODE_OAUTH_TOKEN:
      OPENAI_API_KEY:
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: bind
        source: ${HOST_SSH_DIR:?Set HOST_SSH_DIR via admin.sh or environment}
        target: /home/operator/.ssh
        read_only: true
      - type: bind
        source: ${HOST_PROXMOX_TOKEN_FILE:?Set HOST_PROXMOX_TOKEN_FILE via admin.sh or environment}
        target: /run/secrets/proxmox-token
        read_only: true
      - type: bind
        source: ./.local/cache
        target: /home/operator/.cache
      - type: bind
        source: ${HOST_CLAUDE_DIR:?Set HOST_CLAUDE_DIR via admin.sh or environment}
        target: /home/operator/.claude
      - type: bind
        source: ${HOST_CODEX_DIR:?Set HOST_CODEX_DIR via admin.sh or environment}
        target: /home/operator/.codex
