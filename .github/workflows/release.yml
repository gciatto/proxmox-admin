name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

# Releases are strictly sequential; never publish from a pull request.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Run complete CI suite
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Release with semantic-release (GitHub release + GHCR/Docker Hub image)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # all history and tags, for semantic-release
          # Let semantic-release push with its own token (RELEASE_TOKEN may bypass branch protection).
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Get Node version
        id: node
        run: echo "version=$(jq -r .engines.node package.json)" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Release
        run: |
          npm install
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
