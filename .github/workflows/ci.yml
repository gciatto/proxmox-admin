name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - master
      - 'renovate/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    name: Source tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Shell/YAML checks and Python unit tests
        run: bash scripts/check.sh --test

  image-smoke:
    name: Docker smoke test (${{ matrix.arch }})
    needs: source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Enable emulated architectures
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build single-platform image for testing (do not push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: proxmox-admin:ci-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise installed tools without cluster credentials
        run: bash scripts/smoke-image.sh proxmox-admin:ci-${{ matrix.arch }}
