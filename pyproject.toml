[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxmox-admin-cli"
version = "0.1.0"
description = "Container-friendly Proxmox VE administration CLI"
requires-python = ">=3.10"
dependencies = ["proxmoxer>=2.3,<3", "requests>=2.31,<3"]

[dependency-groups]
dev = ["PyYAML>=6,<7"]

[project.scripts]
px = "pxadmin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
